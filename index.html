<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahzain's Birthday Wishes 🎂</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- USER FORM SECTION (Visible to Friends) -->
    <div id="form-container" class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">Shahzain's Birthday Surprise! 🎂</h1>
            <p class="text-slate-400 text-sm mt-2">Leave a short note or birthday wish for Shahzain. We are collecting messages to build a special digital memory page for him!</p>
            <span class="inline-block bg-amber-500/10 text-amber-400 text-xs px-2.5 py-1 rounded-full border border-amber-500/20 mt-3">🤫 Keep it a surprise!</span>
        </div>

        <form id="wish-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Your Name</label>
                <input type="text" id="user-name" required placeholder="e.g. Ali, Hamza..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-400 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Birthday Note / Wish</label>
                <textarea id="user-message" required rows="4" placeholder="Write your birthday message here..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-400 transition"></textarea>
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-3 rounded-xl transition shadow-lg shadow-amber-500/20">
                Send Birthday Wish
            </button>
        </form>

        <div id="success-msg" class="hidden text-center py-6 space-y-2">
            <div class="text-4xl">🎉</div>
            <h2 class="text-xl font-bold text-emerald-400">Wish Submitted!</h2>
            <p class="text-slate-400 text-sm">Thank you for leaving a note for Shahzain.</p>
        </div>
    </div>

    <!-- SECRET ADMIN DASHBOARD (Only for You) -->
    <div id="admin-container" class="hidden max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl mt-6">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h2 class="text-xl font-bold text-amber-400">🔒 Secret Admin Dashboard</h2>
            <button onclick="toggleAdmin(false)" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">Close</button>
        </div>
        <div id="wishes-list" class="space-y-3">
            <p class="text-slate-500 text-center">No wishes submitted yet.</p>
        </div>
    </div>

    <!-- Admin Access Link -->
    <button onclick="checkAdminPassword()" class="mt-8 text-xs text-slate-600 hover:text-slate-400 transition">Admin Access 🔑</button>

    <script>
        // Set your secret admin password here
        const ADMIN_PASSWORD = "mysecretpassword123";

        // Save submitted wish locally
        document.getElementById('wish-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('user-name').value.trim();
            const message = document.getElementById('user-message').value.trim();

            if(!name || !message) return;

            const newWish = {
                id: Date.now(),
                name: name,
                message: message,
                date: new Date().toLocaleString()
            };

            // Get existing wishes from localStorage
            const existingWishes = JSON.parse(localStorage.getItem('shahzain_wishes') || '[]');
            existingWishes.unshift(newWish);

            // Save updated array
            localStorage.setItem('shahzain_wishes', JSON.stringify(existingWishes));

            // Show success screen
            document.getElementById('wish-form').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
        });

        // Admin verification and list view
        function checkAdminPassword() {
            const pass = prompt("Enter Admin Password:");
            if (pass === ADMIN_PASSWORD) {
                toggleAdmin(true);
                loadWishes();
            } else if (pass !== null) {
                alert("Incorrect Password!");
            }
        }

        function toggleAdmin(show) {
            const adminBox = document.getElementById('admin-container');
            if (show) {
                adminBox.classList.remove('hidden');
                adminBox.scrollIntoView({ behavior: 'smooth' });
            } else {
                adminBox.classList.add('hidden');
            }
        }

        function loadWishes() {
            const wishesList = document.getElementById('wishes-list');
            const wishes = JSON.parse(localStorage.getItem('shahzain_wishes') || '[]');

            if (wishes.length === 0) {
                wishesList.innerHTML = `<p class="text-slate-500 text-center py-4">No wishes submitted yet on this browser.</p>`;
                return;
            }

            wishesList.innerHTML = "";
            wishes.forEach((item) => {
                const card = `
                    <div class="bg-slate-900 border border-slate-700/60 p-4 rounded-xl space-y-2">
                        <div class="flex justify-between items-start">
                            <h3 class="font-semibold text-amber-300">${escapeHtml(item.name)}</h3>
                            <span class="text-xs text-slate-500">${item.date}</span>
                        </div>
                        <p class="text-slate-300 text-sm whitespace-pre-wrap">${escapeHtml(item.message)}</p>
                    </div>
                `;
                wishesList.innerHTML += card;
            });
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
