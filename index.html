<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahzain's Birthday Surprise 🎁</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Emoji Picker Styling */
        #emoji-picker {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 20;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        #emoji-picker button {
            font-size: 1.25rem;
            padding: 6px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        #emoji-picker button:hover {
            background-color: #334155;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 md:p-6 relative">

    <!-- Header Section -->
    <div class="text-center mb-8 w-full max-w-2xl space-y-3">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white">
            Shahzain's Birthday Surprise <span class="text-emerald-400">🎉</span>
        </h1>
        <p class="text-lg md:text-xl text-slate-300 font-normal">
            Leave a note or birthday wish below!
        </p>
        <div class="pt-2">
            <span class="inline-flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 text-xs md:text-sm px-3.5 py-1.5 rounded-full border border-emerald-500/20 font-medium">
                <span>🤫</span> 
            </span>
        </div>
    </div>

    <!-- MAIN FORM CONTAINER -->
    <div id="form-container" class="max-w-xl w-full glass-card rounded-2xl p-6 md:p-8 shadow-2xl relative">
        
        <form id="wish-form" class="space-y-6">
            <!-- Name Input -->
            <div class="space-y-2">
                <label class="block text-lg font-semibold text-slate-200">Your Name</label>
                <input type="text" id="user-name" required placeholder="e.g., Ali, Hamza, Hassan..." 
                    class="w-full text-lg bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
            </div>

            <!-- Message Input with Interactive Emoji Picker -->
            <div class="space-y-2 relative">
                <label class="block text-lg font-semibold text-slate-200">Birthday Note / Wish</label>
                <textarea id="user-message" required rows="5" placeholder="Write your birthday message here..." 
                    class="w-full text-lg bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition pr-12"></textarea>
                
                <!-- Emoji Picker Toggle Button -->
                <button type="button" id="emoji-btn" class="absolute bottom-3 right-3 text-2xl hover:scale-110 transition opacity-80 hover:opacity-100 p-1" title="Add Emoji">
                    😃
                </button>
                
                <!-- Emoji Picker Popup -->
                <div id="emoji-picker">
                    <button type="button">🎉</button><button type="button">🎂</button><button type="button">🥳</button><button type="button">🔥</button><button type="button">👑</button>
                    <button type="button">🫡</button><button type="button">🎁</button><button type="button">😂</button><button type="button">🎈</button><button type="button">✨</button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xl py-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/30">
                Send Birthday Wish 🚀
            </button>
        </form>

        <!-- Success Message -->
        <div id="success-msg" class="hidden text-center py-8 space-y-3">
            <div class="text-6xl">🙌</div>
            <h2 class="text-2xl md:text-3xl font-bold text-emerald-400">Wish Submitted!</h2>
            <p class="text-slate-300 text-base">Your message has been saved for Shahzain's birthday.</p>
        </div>
    </div>

    <!-- SECRET ADMIN DASHBOARD (Only for You) -->
    <div id="admin-container" class="hidden max-w-3xl w-full glass-card rounded-2xl p-6 md:p-8 shadow-2xl mt-8">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700/80 pb-4">
            <h2 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
                <span>🔒</span> Secret Admin Dashboard
            </h2>
            <button onclick="toggleAdmin(false)" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 font-medium transition">
                Close
            </button>
        </div>
        <div id="wishes-list" class="space-y-4">
            <p class="text-slate-400 text-center py-6">No wishes submitted yet on this browser.</p>
        </div>
    </div>

    <!-- Admin Access Link -->
    <button onclick="checkAdminPassword()" class="mt-10 text-xs text-slate-500 hover:text-slate-400 transition">
        Admin Access 🔑
    </button>

    <script>
        // Secret password set here
        const ADMIN_PASSWORD = "mysecretpassword123";

        // Interactive Emoji Picker Logic
        const emojiBtn = document.getElementById('emoji-btn');
        const emojiPicker = document.getElementById('emoji-picker');
        const userMessage = document.getElementById('user-message');

        emojiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
        });

        // Close emoji picker on click outside
        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
                emojiPicker.style.display = 'none';
            }
        });

        emojiPicker.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                userMessage.value += e.target.innerText;
                emojiPicker.style.display = 'none';
                userMessage.focus();
            }
        });

        // Save submitted wish locally
        document.getElementById('wish-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('user-name').value.trim();
            const message = document.getElementById('user-message').value.trim();

            if(!name || !message) return;

            const newWish = {
                id: Date.now(),
                name: name,
                message: message,
                date: new Date().toLocaleString()
            };

            const existingWishes = JSON.parse(localStorage.getItem('shahzain_wishes') || '[]');
            existingWishes.unshift(newWish);

            localStorage.setItem('shahzain_wishes', JSON.stringify(existingWishes));

            document.getElementById('wish-form').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
        });

        // Admin verification and list view
        function checkAdminPassword() {
            const pass = prompt("Enter Admin Password:");
            if (pass === ADMIN_PASSWORD) {
                toggleAdmin(true);
                loadWishes();
            } else if (pass !== null) {
                alert("Incorrect Password!");
            }
        }

        function toggleAdmin(show) {
            const adminBox = document.getElementById('admin-container');
            if (show) {
                adminBox.classList.remove('hidden');
                adminBox.scrollIntoView({ behavior: 'smooth' });
            } else {
                adminBox.classList.add('hidden');
            }
        }

        function loadWishes() {
            const wishesList = document.getElementById('wishes-list');
            const wishes = JSON.parse(localStorage.getItem('shahzain_wishes') || '[]');

            if (wishes.length === 0) {
                wishesList.innerHTML = `<p class="text-slate-400 text-center py-6">No wishes submitted yet on this browser.</p>`;
                return;
            }

            wishesList.innerHTML = "";
            wishes.forEach((item) => {
                const card = `
                    <div class="bg-slate-900/90 border border-slate-700/80 p-5 rounded-xl space-y-2">
                        <div class="flex justify-between items-start gap-4">
                            <h3 class="text-xl font-bold text-emerald-400">${escapeHtml(item.name)}</h3>
                            <span class="text-xs text-slate-500 font-medium whitespace-nowrap">${item.date}</span>
                        </div>
                        <p class="text-base text-slate-200 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.message)}</p>
                    </div>
                `;
                wishesList.innerHTML += card;
            });
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
